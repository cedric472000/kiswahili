<body>

<!-- Gerüst: links die Navigationsspalte (ab 900px), unten die Tab-Leiste
     auf dem Handy. Beides füllt app.js, damit es nur eine Quelle gibt. -->
<div class="shell">
  <aside id="rail" class="rail hidden"></aside>
  <div class="colmain">

        <h1>JavaScript ist abgeschaltet</h1>

    </main>

    <footer>
      <div class="footer-in">
        Mwalimu Amani ist eine erfundene Lehrerfigur. Alle Inhalte folgen dem

    </footer>

<!-- Daten zuerst, dann Logik. Bewusst ohne ES-Module, damit die Seite

<script>
/* Service Worker nur auf einer echten Webadresse registrieren. Per
   file:// gibt es ihn nicht, und im Artefakt-Rahmen ist er gesperrt —
   in beiden Fällen läuft die App einfach ohne Offline-Cache weiter. */
(function () {
  if (!("serviceWorker" in navigator)) return;
  if (location.protocol !== "http:" && location.protocol !== "https:") return;

  /* Übernimmt ein neuer Service Worker die Seite, stammen die gerade
     geladenen Skripte noch vom alten. Einmal neu laden holt die neue
     Fassung sofort — sonst sähe man sie erst beim übernächsten Öffnen.
     Beim allerersten Besuch (vorher kein Controller) passiert nichts. */
  var hatteController = !!navigator.serviceWorker.controller;
  var schonNeugeladen = false;
  navigator.serviceWorker.addEventListener("controllerchange", function () {
    if (!hatteController || schonNeugeladen) return;
    schonNeugeladen = true;
    location.reload();
  });

  window.addEventListener("load", function () {
    navigator.serviceWorker.register("sw.js").catch(function () { /* egal */ });
  });
})();
</script>

</body>
</html>
